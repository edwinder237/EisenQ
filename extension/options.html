<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>EisenQ Capture — Options</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        padding: 24px;
        background: #030712;
        color: #fff;
        font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .wrap {
        max-width: 420px;
      }
      h1 {
        margin: 0 0 4px;
        font-size: 16px;
      }
      p {
        margin: 0 0 16px;
        color: #9ca3af;
        font-size: 13px;
      }
      label {
        display: block;
        margin-bottom: 6px;
        color: #9ca3af;
        font-size: 12px;
        font-weight: 500;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        padding: 8px 12px;
        border: 1px solid #1f2937;
        border-radius: 8px;
        background: #111827;
        color: #fff;
        font-size: 14px;
      }
      input:focus {
        border-color: #4b5563;
        outline: none;
      }
      button {
        margin-top: 12px;
        padding: 8px 16px;
        border: 0;
        border-radius: 8px;
        background: #fff;
        color: #030712;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
      }
      .status {
        margin-left: 10px;
        color: #4ade80;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>EisenQ Capture</h1>
      <p>Where your EisenQ app is running.</p>
      <label for="origin">App origin</label>
      <input id="origin" type="url" placeholder="http://localhost:3000" />
      <div>
        <button id="save">Save</button>
        <span id="status" class="status"></span>
      </div>
    </div>
    <script src="options.js"></script>
  </body>
</html>
